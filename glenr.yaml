# pulse as a RESOURCE SET (design/83, D-83.10): one file declaring the whole
# repository's contribution. Connect this repository to a cell and the plan
# screen shows exactly these four resources, their edges and their addresses —
# then one apply creates them all.
#
# `connects: [api]` is BOTH the network allow-edge and the injected address:
# each consumer receives API_HOST and API_PORT. The per-directory glenr.yaml
# files remain for anyone deploying a single directory on its own; those are
# `kind:` files and design/97 did not touch them.
#
# ☠️ THE ROOT KEY IS `resources:` AND USED TO BE `apps:` (design/97 Q-97.1).
# Only this one line changed — every row below is byte-identical. The parser
# still RECOGNISES `apps:` on purpose, so a file that has not been converted
# gets "glenr.yaml's root key is resources: now — this file still says apps:.
# Rename the key; each row is unchanged" instead of a refusal that misdiagnoses
# the file as a per-resource one.
#
# DATABASE (GE-448): `api` stores its pings in PostgreSQL when a database is
# connected to it, and in memory otherwise. No database row is declared here: a
# `connects:` to a database that no file or cell declares is refused, so the
# database is added to the cell first and `api` is connected to it afterwards.
# `api` reads whichever <NAME>_URL the connection injects (see api/store.go).
resources:
  - name: web
    dir: web
    kind: service
    expose: public
    connects: [api]

  - name: api
    dir: api
    kind: service
    expose: internal
    port: 3000
    connects: [maindb]

  - name: worker
    dir: worker
    kind: worker
    connects: [api]

  - name: cron
    dir: cron
    kind: cron
    cron:
      schedule: "*/5 * * * *"
    connects: [api]
